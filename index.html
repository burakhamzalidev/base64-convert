<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Base64 verisini HTML, Word (.docx), PDF veya kaynak dosyaya dönüştürür. Tüm işlem tarayıcıda yapılır, veri hiçbir sunucuya gönderilmez.">
<meta name="theme-color" content="#2f6feb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6feb'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,Arial,sans-serif' font-size='24' font-weight='700' text-anchor='middle' fill='white'%3EB64%3C/text%3E%3C/svg%3E">
<title>Base64 → HTML / Word / PDF Dönüştürücü</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --border:#dfe3e8; --text:#1b1f24; --muted:#666e78;
    --accent:#2f6feb; --accent-fg:#ffffff; --word:#185abd; --ok:#177245; --err:#b3261e; --code:#f0f2f5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --panel:#1c2024; --border:#2e343b; --text:#e6e8ea; --muted:#98a1ab;
      --accent:#4f8cff; --accent-fg:#0b0e11; --word:#4f8cff; --ok:#4ade80; --err:#ff6b63; --code:#22272c;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
  header{padding:20px 24px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  header .hgroup{min-width:0}
  h1{margin:0;font-size:20px}
  .langs{display:flex;gap:4px;flex:none}
  .langs button{font-size:12px;font-weight:600;padding:5px 10px;letter-spacing:.04em}
  .langs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  header p{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:82ch}
  main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 24px 24px}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
         display:flex;flex-direction:column;min-height:460px;overflow:hidden}
  .panel h2{margin:0;padding:12px 14px;font-size:12px;font-weight:600;color:var(--muted);
            border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.06em}
  textarea{flex:1;border:0;outline:0;resize:none;padding:14px;background:transparent;color:var(--text);
           font:13px/1.45 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-all}
  .drop{outline:2px dashed var(--accent);outline-offset:-6px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--border)}
  button{font:inherit;font-size:13px;padding:7px 14px;border-radius:7px;border:1px solid var(--border);
         background:var(--panel);color:var(--text);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
  button.word{background:var(--word);border-color:var(--word);color:#fff;font-weight:600}
  button.word:disabled{background:var(--panel);border-color:var(--border);color:var(--text)}
  label.file{font-size:13px;padding:7px 14px;border:1px solid var(--border);border-radius:7px;cursor:pointer}
  label.file:hover{border-color:var(--accent)}
  input[type=file]{display:none}
  .status{padding:8px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);
          min-height:34px;display:flex;align-items:center}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .tabs{display:flex;gap:4px;padding:8px 14px 0}
  .tabs button{border-radius:7px 7px 0 0}
  .tabs button[aria-selected=true]{background:var(--code);border-color:var(--border);font-weight:600}
  .modes{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border)}
  .modes button{font-size:12.5px;font-weight:600;padding:6px 12px}
  .modes button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  .dropzone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:10px;padding:24px;text-align:center;color:var(--muted);font-size:13.5px}
  .dropzone strong{color:var(--text);font-size:15px}
  .dropzone .hint{font-size:12.5px}
  #encText{height:120px;flex:none;border-top:1px solid var(--border)}
  #b64out{position:absolute;inset:0;width:100%;height:100%;border:0;outline:0;resize:none;padding:14px;
          background:var(--code);color:var(--text);
          font:12.5px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  .view{flex:1;position:relative;background:var(--code)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  pre.out{position:absolute;inset:0;margin:0;overflow:auto;padding:14px;
          font:12.5px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .hidden{display:none !important}
  .opts{display:flex;gap:16px;align-items:center;padding:0 14px 10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="hgroup">
    <h1 data-i18n="appTitle">Base64 → HTML / Word / PDF Dönüştürücü</h1>
    <p data-i18n-html="intro">Base64 metnini yapıştır veya dosya sürükle.</p>
  </div>
  <div class="langs">
    <button id="langTr" aria-selected="true">TR</button>
    <button id="langEn" aria-selected="false">EN</button>
  </div>
</header>

<main>
  <section class="panel" id="inPanel">
    <div class="modes">
      <button id="modeDecode" aria-selected="true" data-i18n="modeDecode">Base64 → Dosya (çöz)</button>
      <button id="modeEncode" aria-selected="false" data-i18n="modeEncode">Dosya → Base64 (kodla)</button>
    </div>

    <!-- ÇÖZME -->
    <textarea id="input" spellcheck="false" data-i18n-ph="inputPh"></textarea>
    <div class="opts" id="decOpts">
      <label><input type="checkbox" id="optWrap" checked> <span data-i18n="optWrap">Metin/resim için HTML şablonuna sar</span></label>
      <label><input type="checkbox" id="optUrlSafe" checked> <span data-i18n="optUrlSafe">URL-safe base64 (-_) kabul et</span></label>
    </div>
    <div class="bar" id="decBarIn">
      <button class="primary" id="btnConvert" data-i18n="btnConvert">Dönüştür</button>
      <label class="file"><span data-i18n="btnFile">Dosya seç</span><input type="file" id="fileIn"></label>
      <button id="btnPaste" data-i18n="btnPaste">Panodan yapıştır</button>
      <button id="btnSample" data-i18n="btnSample">Örnek</button>
      <button id="btnClear" data-i18n="btnClear">Temizle</button>
    </div>

    <!-- KODLAMA -->
    <div class="dropzone hidden" id="encDrop">
      <strong data-i18n="dropTitle">Dosyayı buraya sürükle</strong>
      <span data-i18n="dropSub">her tür dosya olur — resim, PDF, Word, ZIP…</span>
      <label class="file"><span data-i18n="btnFile">Dosya seç</span><input type="file" id="encFileIn"></label>
      <span class="hint" data-i18n="dropHint">ya da aşağıdaki kutuya metin yaz</span>
    </div>
    <textarea id="encText" class="hidden" spellcheck="false" data-i18n-ph="encTextPh"></textarea>
    <div class="opts hidden" id="encOpts">
      <label><input type="checkbox" id="optDataUri"> <span data-i18n="optDataUri">data: URI olarak ver</span></label>
      <label><input type="checkbox" id="optLineWrap"> <span data-i18n="optLineWrap">76 karakterde satır kır</span></label>
    </div>
    <div class="bar hidden" id="encBarIn">
      <button class="primary" id="btnEncode" data-i18n="btnEncode">Base64'e çevir</button>
      <button id="btnEncClear" data-i18n="btnClear">Temizle</button>
    </div>

    <div class="status" id="status">Hazır. (Ctrl+Enter ile de dönüştürebilirsin.)</div>
  </section>

  <section class="panel">
    <h2 id="outTitle">Sonuç</h2>
    <div class="tabs" id="decTabs">
      <button id="tabPreview" aria-selected="true" data-i18n="tabPreview">Önizleme</button>
      <button id="tabCode" aria-selected="false" data-i18n="tabCode">HTML kaynağı</button>
    </div>
    <div class="view">
      <iframe id="preview" data-i18n-title="tabPreview" title="Önizleme" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>
      <pre class="out hidden" id="code"></pre>
      <textarea id="b64out" class="hidden" readonly spellcheck="false"></textarea>
    </div>
    <div class="bar" id="decBar">
      <button class="primary" id="btnSave" disabled data-i18n="btnSave">.html kaydet</button>
      <button class="word" id="btnWord" disabled data-i18n="btnWord">Word (.docx) kaydet</button>
      <button id="btnPdf" disabled data-i18n="btnPdf">PDF olarak kaydet</button>
      <button id="btnRaw" disabled>Kaynak dosya</button>
      <button id="btnCopy" disabled data-i18n="btnCopy">HTML'i kopyala</button>
      <button id="btnOpen" disabled data-i18n="btnOpen">Yeni sekmede aç</button>
    </div>
    <div class="bar hidden" id="encBar">
      <button class="primary" id="btnB64Copy" disabled data-i18n="btnB64Copy">Base64'ü kopyala</button>
      <button id="btnB64Save" disabled data-i18n="btnB64Save">.txt kaydet</button>
    </div>
  </section>
</main>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var input = $("input"), statusEl = $("status"), preview = $("preview"), codeEl = $("code");
  var result = null;   // { html, kind, size, text, word }

  /* ================= diller ================= */
  /* Her kayıt [türkçe, ingilizce]. t("anahtar", arg1…) ile {1}, {2} yerine geçer. */
  var S = {
    appTitle:    ["Base64 → HTML / Word / PDF Dönüştürücü", "Base64 → HTML / Word / PDF Converter"],
    intro:       ["Base64 metnini yapıştır veya dosya sürükle. İçerik otomatik algılanır — HTML, düz metin, resim, PDF, <strong>Word (.docx)</strong>, Excel, PowerPoint, ZIP — önizlenir ve <strong>.html</strong>, <strong>.docx</strong>, <strong>.pdf</strong> ya da kaynak dosya olarak kaydedilir.",
                  "Paste base64 or drop a file. The content is detected automatically — HTML, plain text, images, PDF, <strong>Word (.docx)</strong>, Excel, PowerPoint, ZIP — previewed, and saved as <strong>.html</strong>, <strong>.docx</strong>, <strong>.pdf</strong> or the original file."],

    modeEncode:  ["Dosya → Base64 (kodla)", "File → Base64 (encode)"],
    inputPh:     ["PGgxPk1lcmhhYmE8L2gxPg==\n\nveya:  data:image/png;base64,iVBORw0KGgo...\n\nBuraya .txt / .b64 dosyası da sürükleyebilirsin.",
                  "PGgxPkhlbGxvPC9oMT4=\n\nor:  data:image/png;base64,iVBORw0KGgo...\n\nYou can also drop a .txt / .b64 file here."],
    optWrap:     ["Metin/resim için HTML şablonuna sar", "Wrap text/images in an HTML template"],
    optUrlSafe:  ["URL-safe base64 (-_) kabul et", "Accept URL-safe base64 (-_)"],

    dropTitle:   ["Dosyayı buraya sürükle", "Drop a file here"],

    dropHint:    ["ya da aşağıdaki kutuya metin yaz", "or type text in the box below"],
    encTextPh:   ["Base64'e çevrilecek metni buraya yaz…", "Type the text to encode as base64…"],
    optDataUri:  ["data: URI olarak ver", "Output as a data: URI"],
    optLineWrap: ["76 karakterde satır kır", "Wrap lines at 76 characters"],
    btnEncode:   ["Base64'e çevir", "Encode to base64"],
    outTitle:    ["Sonuç", "Result"],
    outTitleEnc: ["Base64 çıktısı", "Base64 output"],
    tabPreview:  ["Önizleme", "Preview"],
    tabCode:     ["HTML kaynağı", "HTML source"],
    btnSave:     [".html kaydet", "Save .html"],
    btnWord:     ["Word (.docx) kaydet", "Save Word (.docx)"],
    btnPdf:      ["PDF olarak kaydet", "Save as PDF"],

    btnRawExt:   ["Kaynak dosya (.{1})", "Original file (.{1})"],

    btnB64Copy:  ["Base64'ü kopyala", "Copy base64"],
    btnB64Save:  [".txt kaydet", "Save .txt"],

    ready:       ["Hazır. (Ctrl+Enter ile de dönüştürebilirsin.)", "Ready. (Ctrl+Enter also converts.)"],
    encReady:    ["Bir dosya sürükle, seç ya da aşağıya metin yaz.", "Drop or choose a file, or type text below."],
    cleared:     ["Temizlendi.", "Cleared."],
    decoding:    ["Çözülüyor…", "Decoding…"],
    encoding:    ["Kodlanıyor…", "Encoding…"],
    needInput:   ["Önce base64 metnini gir.", "Enter some base64 first."],
    needSource:  ["Önce bir dosya seç ya da metin yaz.", "Choose a file or type some text first."],

    errEmpty:    ["Girdi boş.", "Input is empty."],
    errChars:    ["Girdide base64 olmayan karakterler var.", "The input contains non-base64 characters."],
    errLength:   ["Base64 uzunluğu geçersiz (eksik ya da fazla karakter var).", "Invalid base64 length (a character is missing or extra)."],
    errDecode:   ["Base64 çözülemedi: bozuk veri.", "Could not decode base64: corrupt data."],
    errZipDir:   ["ZIP merkezi dizini bulunamadı.", "ZIP central directory not found."],
    errZip64:    ["ZIP64 arşivleri desteklenmiyor.", "ZIP64 archives are not supported."],
    errZipRead:  ["ZIP içeriği okunamadı.", "Could not read the ZIP contents."],
    errNoPart:   ["Aranan parça arşivde yok.", "The requested part is missing from the archive."],
    errMethod:   ["Desteklenmeyen ZIP sıkıştırması ({1}).", "Unsupported ZIP compression method ({1})."],
    errInflate:  ["Bu tarayıcı sıkıştırılmış ZIP açmayı desteklemiyor.", "This browser cannot decompress ZIP archives."],
    errDocXml:   ["document.xml okunamadı.", "Could not read document.xml."],
    errDocBody:  ["Word gövdesi bulunamadı.", "Word document body not found."],
    errFileRead: ["Dosya okunamadı.", "Could not read the file."],
    errPopup:    ["Açılır pencere engellendi.", "The pop-up was blocked."],
    errPopupPdf: ["Açılır pencere engellendi — tarayıcıda bu site için izin ver, sonra tekrar dene.",
                  "The pop-up was blocked — allow pop-ups for this site, then try again."],
    errClipRead: ["Tarayıcı pano okumayı desteklemiyor; Ctrl+V ile yapıştır.",
                  "This browser cannot read the clipboard; paste with Ctrl+V."],
    errClipPerm: ["Pano izni verilmedi; Ctrl+V ile yapıştır.", "Clipboard permission denied; paste with Ctrl+V."],
    errCopy:     ["Kopyalanamadı — 'HTML kaynağı' sekmesinden seçip kopyala.",
                  "Copy failed — select the text on the 'HTML source' tab instead."],
    errCopyB64:  ["Kopyalanamadı — çıktı kutusundan seçip kopyala.", "Copy failed — select the text in the output box instead."],
    errWord:     ["Word dosyası oluşturulamadı: {1}", "Could not build the Word file: {1}"],
    errPrint:    ["Yazdırma penceresi açılamadı: {1}", "Could not open the print dialog: {1}"],

    kHtmlDoc:    ["HTML belgesi", "HTML document"],
    kHtmlFrag:   ["HTML parçası", "HTML fragment"],
    kDocx:       ["Word belgesi (.docx)", "Word document (.docx)"],
    kXlsx:       ["Excel çalışma kitabı (.xlsx)", "Excel workbook (.xlsx)"],
    kPptx:       ["PowerPoint sunumu (.pptx)", "PowerPoint presentation (.pptx)"],
    kZip:        ["ZIP arşivi", "ZIP archive"],
    kZipBad:     ["Bozuk ZIP verisi", "Corrupt ZIP data"],
    kImage:      ["Görsel ({1})", "Image ({1})"],
    kPdf:        ["PDF", "PDF"],
    kText:       ["Düz metin", "Plain text"],
    kBinary:     ["İkili veri", "Binary data"],
    kBinaryMime: ["İkili veri ({1})", "Binary data ({1})"],

    wTitleImage: ["Görsel", "Image"],
    wTitleText:  ["Metin", "Text"],
    wTitleHtml:  ["HTML", "HTML"],
    wTitleDocx:  ["Word belgesi", "Word document"],
    wTitleBin:   ["İkili dosya", "Binary file"],
    wBinBody:    ["<p>Çözülen içerik metin değil{1}, {2} bayt.</p><p><b>Kaynak dosya</b> düğmesiyle diske kaydedebilirsin.</p>",
                  "<p>The decoded content is not text{1} — {2} bytes.</p><p>Use the <b>Original file</b> button to save it.</p>"],
    wOffice:     ["<p>{1} tanındı, {2} bayt.</p><p>İçeriği HTML olarak gösterilemiyor. <b>Kaynak dosya (.{3})</b> düğmesiyle kaydedip Office'te açabilirsin.</p>",
                  "<p>{1} detected, {2} bytes.</p><p>Its contents cannot be shown as HTML. Use <b>Original file (.{3})</b> to save and open it in Office.</p>"],
    wZipBody:    ["<p>ZIP arşivi — {1} öğe, {2} bayt.</p>", "<p>ZIP archive — {1} entries, {2} bytes.</p>"],
    wZipMore:    ["<p>… ve {1} öğe daha</p>", "<p>… and {1} more entries</p>"],
    wZipBad:     ["<p>ZIP imzası var ama arşiv okunamadı, {1} bayt.</p>", "<p>It has a ZIP signature but could not be read — {1} bytes.</p>"],
    wDocxFail:   ["<p>Word belgesi tanındı ({1} bayt), ancak içeriği okunamadı: {2}</p><p><b>Word (.docx) kaydet</b> ile dosyayı olduğu gibi alabilirsin.</p>",
                  "<p>Word document detected ({1} bytes), but its contents could not be read: {2}</p><p>Use <b>Save Word (.docx)</b> to download it unchanged.</p>"],
    docEmpty:    ["(belge boş)", "(document is empty)"],
    xEmpty:      ["(boş içerik)", "(empty content)"],
    xImgSrc:     ["[görsel: {1}]", "[image: {1}]"],
    xImgNone:    ["kaynak yok", "no source"],
    xImgType:    ["[Word'e gömülemeyen görsel türü: {1}]", "[image type that Word cannot embed: {1}]"],
    xImgFail:    ["[görsel çözülemedi]", "[image could not be decoded]"],

    okDecoded:   ["Tamam — {1}, {2} bayt çözüldü.", "Done — {1}, {2} bytes decoded."],
    okNoWord:    [" Word'e çevrilemez; .html ya da kaynak dosya olarak kaydedebilirsin.",
                  " Cannot be converted to Word; save it as .html or as the original file."],
    okPreviewNo: [" Önizleme oluşturulamadı: {1}", " Preview could not be built: {1}"],
    okEncoded:   ["{1} → {2} karakterlik base64 ({3} bayt).", "{1} → {2} characters of base64 ({3} bytes)."],
    encLabelText:["Metin", "Text"],
    encName:     ["metin.b64.txt", "text.b64.txt"],
    okSavedHtml: ["cikti.html indirildi.", "cikti.html downloaded."],
    okSavedDocx: ["cikti.docx indirildi ({1} KB)", "cikti.docx downloaded ({1} KB)"],
    okDocxOrig:  [" — kaynak belge birebir korundu.", " — the original document was preserved byte for byte."],
    okSavedRaw:  ["{1} indirildi ({2} bayt).", "{1} downloaded ({2} bytes)."],
    okSavedTxt:  ["{1} indirildi.", "{1} downloaded."],
    okCopied:    ["HTML panoya kopyalandı.", "HTML copied to the clipboard."],
    okCopiedB64: ["Base64 panoya kopyalandı.", "Base64 copied to the clipboard."],
    okPrint:     ['Yazdırma penceresi açıldı — "Hedef" olarak "PDF olarak kaydet" seç.',
                  'The print dialog is open — choose "Save as PDF" as the destination.']
  };

  var lang = "tr";

  function t(key){
    var row = S[key];
    var s = row ? row[lang === "en" ? 1 : 0] : key;
    for (var i = 1; i < arguments.length; i++) s = s.split("{" + i + "}").join(arguments[i]);
    return s;
  }

  function fmt(n){ return n.toLocaleString(lang === "en" ? "en-US" : "tr-TR"); }

  function applyLang(){
    document.documentElement.lang = lang;
    document.title = t("appTitle");
    $("langTr").setAttribute("aria-selected", String(lang === "tr"));
    $("langEn").setAttribute("aria-selected", String(lang === "en"));

    var set = function(sel, apply){
      Array.prototype.forEach.call(document.querySelectorAll(sel), apply);
    };
    set("[data-i18n]",       function(el){ el.textContent = t(el.getAttribute("data-i18n")); });
    set("[data-i18n-html]",  function(el){ el.innerHTML   = t(el.getAttribute("data-i18n-html")); });
    set("[data-i18n-ph]",    function(el){ el.placeholder = t(el.getAttribute("data-i18n-ph")); });
    set("[data-i18n-title]", function(el){ el.title       = t(el.getAttribute("data-i18n-title")); });

    $("outTitle").textContent = t(mode === "decode" ? "outTitle" : "outTitleEnc");
    if (result && result.raw) $("btnRaw").textContent = t("btnRawExt", result.raw.ext);

    // Açık sonucu yeni dilde yeniden üret
    if (mode === "decode" && result) convert();
    else if (mode === "encode" && encSource) renderEncoded();
    else setStatus(t(mode === "decode" ? "ready" : "encReady"));
  }

  function setLang(l){
    lang = (l === "en") ? "en" : "tr";
    try { localStorage.setItem("b64lang", lang); } catch(e){}
    applyLang();
  }

  function setStatus(msg, cls){
    statusEl.textContent = msg;
    statusEl.className = "status" + (cls ? " " + cls : "");
  }

  function esc(s){
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* ================= base64 çözme ================= */

  /* data: URI öneki, boşluklar, URL-safe alfabe ve eksik padding temizlenir */
  function normalize(raw){
    var s = raw.trim();
    var mime = null;
    var m = s.match(/^data:([^;,]*)(;[^,]*)*,/i);
    if (m){ mime = m[1] || null; s = s.slice(m[0].length); }
    s = s.replace(/\s+/g, "");
    if ($("optUrlSafe").checked) s = s.replace(/-/g, "+").replace(/_/g, "/");
    s = s.replace(/=+$/, "");
    if (!s) throw new Error(t("errEmpty"));
    if (!/^[A-Za-z0-9+/]*$/.test(s)) throw new Error(t("errChars"));
    var pad = s.length % 4;
    if (pad === 1) throw new Error(t("errLength"));
    if (pad) s += new Array(5 - pad).join("=");
    return { b64: s, mime: mime };
  }

  function toBytes(b64){
    var bin;
    try { bin = atob(b64); }
    catch(e){ throw new Error(t("errDecode")); }
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /* imza (magic bytes) ile tür tespiti */
  function sniff(b){
    var at = function(i, arr){
      for (var k = 0; k < arr.length; k++) if (b[i + k] !== arr[k]) return false;
      return true;
    };
    if (at(0, [0x89,0x50,0x4E,0x47])) return "image/png";
    if (at(0, [0xFF,0xD8,0xFF]))      return "image/jpeg";
    if (at(0, [0x47,0x49,0x46,0x38])) return "image/gif";
    if (at(0, [0x25,0x50,0x44,0x46])) return "application/pdf";
    if (at(0, [0x52,0x49,0x46,0x46]) && at(8, [0x57,0x45,0x42,0x50])) return "image/webp";
    if (at(0, [0x00,0x00,0x01,0x00])) return "image/x-icon";
    if (at(0, [0x50,0x4B,0x03,0x04])) return "application/zip";
    return null;

  function decodeText(bytes){
    try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); }

  }

  function looksLikeHtml(t){
    return /<!doctype\s+html|<html[\s>]|<body[\s>]|<(div|p|h[1-6]|table|span|img|a|ul|ol|section|article)\b[^>]*>/i.test(t);
  }

  function wrap(title, body){
    return '<!doctype html>\n<html lang="tr">\n<head>\n<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
      + '<title>' + esc(title) + '</title>\n'
      + '<style>body{margin:0;padding:24px;background:#fff;color:#111;'
      + 'font:15px/1.6 "Segoe UI",system-ui,sans-serif}'
      + 'img{max-width:100%;height:auto}p{margin:0 0 10px}p.liste{margin-left:26px}'
      + 'table{border-collapse:collapse;margin:12px 0}'
      + 'td,th{border:1px solid #ccc;padding:6px 10px;vertical-align:top}'
      + 'pre{white-space:pre-wrap;word-break:break-word;background:#f4f5f7;'
      + 'padding:16px;border-radius:8px;font:13px/1.5 Consolas,monospace}'
      + 'embed{width:100%;height:90vh;border:1px solid #ddd;border-radius:8px}</style>\n'
      + '</head>\n<body>\n' + body + '\n</body>\n</html>\n';
  }

  /* ================= ZIP yazıcı (docx paketi için) ================= */

  var crcTable = (function(){
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++){
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(u8){
    var c = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function utf8(s){ return new TextEncoder().encode(s); }

  /* Sıkıştırmasız (store) ZIP — docx için yeterli ve kütüphanesiz */
  function makeZip(entries, mimeType){
    var d = new Date();
    var dosTime = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | (Math.floor(d.getSeconds() / 2) & 31);
    var dosDate = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
    var local = [], central = [], offset = 0;

    entries.forEach(function(f){
      var name = utf8(f.name), data = f.data, crc = crc32(data);

      var lh = new Uint8Array(30 + name.length), lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);          // sürüm
      lv.setUint16(6, 0x0800, true);      // UTF-8 ad bayrağı
      lv.setUint16(8, 0, true);           // yöntem: store
      lv.setUint16(10, dosTime, true); lv.setUint16(12, dosDate, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true);
      lv.setUint16(26, name.length, true); lv.setUint16(28, 0, true);
      lh.set(name, 30);
      local.push(lh, data);

      var ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true); cv.setUint16(14, dosDate, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true); cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true); cv.setUint32(42, offset, true);
      ch.set(name, 46);
      central.push(ch);

      offset += lh.length + data.length;
    });

    var cdSize = central.reduce(function(a, b){ return a + b.length; }, 0);
    var eo = new Uint8Array(22), ev = new DataView(eo.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
    ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    return new Blob(local.concat(central, [eo]), { type: mimeType });
  }

  /* ================= HTML → DOCX ================= */

  var NS = {
    w:   "http://schemas.openxmlformats.org/wordprocessingml/2006/main",
    r:   "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
    wp:  "http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing",
    a:   "http://schemas.openxmlformats.org/drawingml/2006/main",
    pic: "http://schemas.openxmlformats.org/drawingml/2006/picture"
  };
  var BLOCK = /^(address|article|aside|blockquote|div|dl|dd|dt|fieldset|figure|figcaption|footer|form|h[1-6]|header|hr|li|main|nav|ol|p|pre|section|table|tbody|thead|tfoot|tr|ul)$/;
  var SKIP  = /^(script|style|head|meta|link|title|noscript|template|iframe|embed|object|svg)$/;
  var MAX_CX = 5943600;   // ~6,5 inç, A4 yazı alanına sığar

  function xesc(s){
    s = String(s);
    var out = "";
    for (var i = 0; i < s.length; i++){
      var c = s.charCodeAt(i);
      if (c < 32 && c !== 9 && c !== 10 && c !== 13) continue;   // XML'de yasak kontrol karakterleri
      out += s.charAt(i);
    }
    return out.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* PNG / JPEG / GIF piksel boyutu */
  function imgSize(b, mime){
    try {
      var dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
      if (mime === "image/png") return { w: dv.getUint32(16), h: dv.getUint32(20) };
      if (mime === "image/gif") return { w: dv.getUint16(6, true), h: dv.getUint16(8, true) };
      if (mime === "image/jpeg"){
        var i = 2;
        while (i < b.length - 8){
          if (b[i] !== 0xFF){ i++; continue; }
          var mk = b[i + 1];
          if (mk === 0xD8 || mk === 0x01 || (mk >= 0xD0 && mk <= 0xD7)){ i += 2; continue; }
          if (mk >= 0xC0 && mk <= 0xCF && mk !== 0xC4 && mk !== 0xC8 && mk !== 0xCC)
            return { h: dv.getUint16(i + 5), w: dv.getUint16(i + 7) };
          i += 2 + dv.getUint16(i + 2);
        }
      }
    } catch(e){}
    return { w: 480, h: 360 };
  }

  function htmlToDocx(html, plainText){
    var blocks = [], rels = [], media = [];
    var relSeq = 1, imgSeq = 0, drawId = 1;   // rId1 = styles.xml

    function addRel(type, target, external){
      var id = "rId" + (++relSeq);
      rels.push({ id: id, type: type, target: target, external: !!external });

    /* --- run / paragraf --- */
    function runXml(text, c){
      if (text === "" || text == null) return "";
      c = c || {};
      var p = "";
      if (c.link)   p += '<w:rStyle w:val="Hyperlink"/>';
      if (c.code)   p += '<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/>';
      if (c.b)      p += "<w:b/>";
      if (c.i)      p += "<w:i/>";
      if (c.strike) p += "<w:strike/>";

      if (!body) return "";
      return "<w:r>" + (p ? "<w:rPr>" + p + "</w:rPr>" : "") + body + "</w:r>";
    }

    function para(runs, o){
      o = o || {};
      var pr = "";
      if (o.style)  pr += '<w:pStyle w:val="' + o.style + '"/>';
      if (o.rule)   pr += '<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="BFBFBF"/></w:pBdr>';
      if (o.indent) pr += '<w:ind w:left="' + (o.indent * 340) + '"/>';
      return "<w:p>" + (pr ? "<w:pPr>" + pr + "</w:pPr>" : "") + runs.join("") + "</w:p>";
    }

    /* --- görsel --- */
    function imageRun(el){
      var src = el.getAttribute("src") || "";
      var m = src.match(/^data:(image\/[a-z+]+);base64,([\s\S]+)$/i);
      if (!m) return runXml(t("xImgSrc", src.slice(0, 70) || t("xImgNone")), { i: true });

      var mime = m[1].toLowerCase();
      if (mime === "image/jpg") mime = "image/jpeg";
      if (mime !== "image/png" && mime !== "image/jpeg" && mime !== "image/gif")
        return runXml(t("xImgType", mime), { i: true });

      var bytes;
      try { bytes = toBytes(m[2].replace(/\s+/g, "")); }
      catch(e){ return runXml(t("xImgFail"), { i: true }); }

        + '<wp:effectExtent l="0" t="0" r="0" b="0"/>'
        + '<wp:docPr id="' + id + '" name="Resim ' + id + '"/>'
        + '<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="' + NS.a + '" noChangeAspect="1"/></wp:cNvGraphicFramePr>'
        + '<a:graphic xmlns:a="' + NS.a + '"><a:graphicData uri="' + NS.pic + '">'
        + '<pic:pic xmlns:pic="' + NS.pic + '">'
        + '<pic:nvPicPr><pic:cNvPr id="' + id + '" name="' + name + '"/><pic:cNvPicPr/></pic:nvPicPr>'
        + '<pic:blipFill><a:blip r:embed="' + rid + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'
        + '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm>'
        + '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>'

    /* --- satır içi içerik --- */
    function inlineRuns(node, ctx, out, keepSpace){

        var tag = n.tagName.toLowerCase();
        if (SKIP.test(tag)) return;
        if (tag === "br"){ out.push("<w:r><w:br/></w:r>"); return; }
        if (tag === "img"){ out.push(imageRun(n)); return; }

        var c = {};
        for (var k in ctx) c[k] = ctx[k];
        if (tag === "b" || tag === "strong") c.b = true;
        if (tag === "i" || tag === "em")     c.i = true;
        if (tag === "u" || tag === "ins")    c.u = true;
        if (tag === "s" || tag === "strike" || tag === "del") c.strike = true;
        if (tag === "code" || tag === "kbd" || tag === "samp" || tag === "tt") c.code = true;

    function leafPara(el, o){

    /* --- tablo --- */

    function walk(parent, indent){

        if (n.nodeType === 3){

          if (t.trim()) blocks.push(para([runXml(t, {})], { indent: indent }));

    /* --- paket --- */
    var documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<w:document xmlns:w="' + NS.w + '" xmlns:r="' + NS.r + '" xmlns:wp="' + NS.wp + '">'
      + "<w:body>" + blocks.join("")
      + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>'
      + '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/>'
      + "</w:sectPr></w:body></w:document>";

      return '<w:style w:type="paragraph" w:styleId="' + id + '"><w:name w:val="' + name + '"/>'
        + '<w:basedOn w:val="Normal"/><w:qFormat/>'
        + '<w:pPr><w:keepNext/><w:spacing w:before="240" w:after="120"/><w:outlineLvl w:val="' + lvl + '"/></w:pPr>'
        + '<w:rPr><w:b/><w:color w:val="1F3864"/><w:sz w:val="' + size + '"/></w:rPr></w:style>';
    }

    var stylesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<w:styles xmlns:w="' + NS.w + '">'
      + "<w:docDefaults><w:rPrDefault><w:rPr>"
      + '<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/>'
      + '<w:lang w:val="tr-TR"/></w:rPr></w:rPrDefault>'
      + '<w:pPrDefault><w:pPr><w:spacing w:after="140" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault>'
      + "</w:docDefaults>"
      + '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'
      + heading("Heading1", "heading 1", 40, 0) + heading("Heading2", "heading 2", 32, 1)
      + heading("Heading3", "heading 3", 28, 2) + heading("Heading4", "heading 4", 24, 3)
      + heading("Heading5", "heading 5", 22, 4) + heading("Heading6", "heading 6", 20, 5)
      + '<w:style w:type="character" w:styleId="Hyperlink"><w:name w:val="Hyperlink"/>'
      + '<w:rPr><w:color w:val="0563C1"/><w:u w:val="single"/></w:rPr></w:style>'
      + '<w:style w:type="paragraph" w:styleId="Kod"><w:name w:val="Kod"/><w:basedOn w:val="Normal"/>'
      + '<w:pPr><w:shd w:val="clear" w:color="auto" w:fill="F2F2F2"/><w:spacing w:after="140"/></w:pPr>'
      + '<w:rPr><w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/><w:sz w:val="20"/></w:rPr></w:style>'
      + "</w:styles>";

    var relTypes = {
      image:     NS.r + "/image",

      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="' + NS.r + '/styles" Target="styles.xml"/>'
      + rels.map(function(x){

      + "</Relationships>";

    var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Default Extension="png" ContentType="image/png"/>'
      + '<Default Extension="jpeg" ContentType="image/jpeg"/>'
      + '<Default Extension="gif" ContentType="image/gif"/>'
      + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
      + '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'
      + "</Types>";

    var pkgRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="' + NS.r + '/officeDocument" Target="word/document.xml"/>'
      + "</Relationships>";

    var entries = [
      { name: "[Content_Types].xml",        data: utf8(contentTypes) },
      { name: "_rels/.rels",                data: utf8(pkgRels) },
      { name: "word/document.xml",          data: utf8(documentXml) },
      { name: "word/styles.xml",            data: utf8(stylesXml) },
      { name: "word/_rels/document.xml.rels", data: utf8(docRels) }
    ].concat(media);

    return makeZip(entries, "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  }

  /* ================= ZIP / DOCX okuma (girdi zaten Office dosyasıysa) ================= */

  function isZip(b){
    return b.length > 4 && b[0] === 0x50 && b[1] === 0x4B && b[2] === 0x03 && b[3] === 0x04;
  }

  function b64encode(u8){
    var s = "", step = 0x8000;
    for (var i = 0; i < u8.length; i += step)
      s += String.fromCharCode.apply(null, u8.subarray(i, i + step));
    return btoa(s);
  }

  /* Merkezi dizinden parça listesi çıkarılır (ZIP64 desteklenmez) */
  function readZip(bytes){
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var eo = -1, stop = Math.max(0, bytes.length - 22 - 65535);
    for (var i = bytes.length - 22; i >= stop; i--)
      if (dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
    if (eo < 0) throw new Error(t("errZipDir"));

    var count = dv.getUint16(eo + 10, true), off = dv.getUint32(eo + 16, true);
    if (off === 0xFFFFFFFF) throw new Error(t("errZip64"));

    var out = {}, p = off;
    for (var n = 0; n < count; n++){
      if (p + 46 > bytes.length || dv.getUint32(p, true) !== 0x02014b50) break;
      var method = dv.getUint16(p + 10, true);
      var csize = dv.getUint32(p + 20, true), usize = dv.getUint32(p + 24, true);
      var nameLen = dv.getUint16(p + 28, true),
          exLen   = dv.getUint16(p + 30, true),
          cmLen   = dv.getUint16(p + 32, true);
      var lh = dv.getUint32(p + 42, true);
      var name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
      if (lh + 30 <= bytes.length && dv.getUint32(lh, true) === 0x04034b50){
        var start = lh + 30 + dv.getUint16(lh + 26, true) + dv.getUint16(lh + 28, true);
        out[name] = { method: method, raw: bytes.subarray(start, start + csize), size: usize };
      }
      p += 46 + nameLen + exLen + cmLen;
    }
    if (!Object.keys(out).length) throw new Error(t("errZipRead"));
    return out;
  }

  function inflate(entry){
    if (!entry) return Promise.reject(new Error(t("errNoPart")));
    if (entry.method === 0) return Promise.resolve(entry.raw);
    if (entry.method !== 8) return Promise.reject(new Error(t("errMethod", entry.method)));
    if (typeof DecompressionStream === "undefined")
      return Promise.reject(new Error(t("errInflate")));
    var stream = new Blob([entry.raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).arrayBuffer().then(function(b){ return new Uint8Array(b); });
  }

  function officeKind(zip){
    if (zip["word/document.xml"])    return "docx";
    if (zip["xl/workbook.xml"])      return "xlsx";
    if (zip["ppt/presentation.xml"]) return "pptx";
    return "zip";
  }

  var WEB_IMG = { png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg",
                  gif:"image/gif", bmp:"image/bmp", webp:"image/webp", svg:"image/svg+xml" };

  /* Görselleri data URI'ye, köprü hedeflerini haritaya çevirir */
  /* Liste biçimleri word/numbering.xml'de durur; madde işaretleri buradan gelir */
  function readDocxNumbering(zip, res){
    var part = zip["word/numbering.xml"];
    if (!part) return Promise.resolve(res);
    return inflate(part).then(function(buf){
      var doc = new DOMParser().parseFromString(new TextDecoder().decode(buf), "application/xml");
      var abs = {}, an = doc.getElementsByTagNameNS(NS.w, "abstractNum");
      for (var i = 0; i < an.length; i++){
        var map = abs[an[i].getAttributeNS(NS.w, "abstractNumId")] = {};
        var lvls = an[i].getElementsByTagNameNS(NS.w, "lvl");
        for (var j = 0; j < lvls.length; j++){
          var fmt = lvls[j].getElementsByTagNameNS(NS.w, "numFmt")[0];
          map[lvls[j].getAttributeNS(NS.w, "ilvl")] = fmt ? (fmt.getAttributeNS(NS.w, "val") || "bullet") : "bullet";
        }
      }
      var nums = doc.getElementsByTagNameNS(NS.w, "num");
      for (var k = 0; k < nums.length; k++){
        var ref = nums[k].getElementsByTagNameNS(NS.w, "abstractNumId")[0];
        if (ref) res.numbering[nums[k].getAttributeNS(NS.w, "numId")] = abs[ref.getAttributeNS(NS.w, "val")] || {};
      }
      return res;
    }).catch(function(){ return res; });
  }

  function readDocxResources(zip){
    var res = { images: {}, links: {}, numbering: {}, counters: {} };
    var rels = zip["word/_rels/document.xml.rels"];
    if (!rels) return Promise.resolve(res);

    return inflate(rels).then(function(buf){
      var doc = new DOMParser().parseFromString(new TextDecoder().decode(buf), "application/xml");
      var list = doc.getElementsByTagName("Relationship"), jobs = [];
      for (var i = 0; i < list.length; i++){
        var id     = list[i].getAttribute("Id"),
            type   = list[i].getAttribute("Type") || "",
            target = list[i].getAttribute("Target") || "";
        if (!id) continue;
        if (/\/hyperlink$/.test(type)){ res.links[id] = target; continue; }
        if (!/\/image$/.test(type)) continue;

        var path = target.charAt(0) === "/" ? target.slice(1)
                 : "word/" + target.replace(/^\.\//, "").replace(/^\.\.\//, "");
        var imgMime = WEB_IMG[(path.split(".").pop() || "").toLowerCase()];
        if (!imgMime || !zip[path]) continue;

        jobs.push(inflate(zip[path]).then(function(rid, m, data){
          res.images[rid] = "data:" + m + ";base64," + b64encode(data);
        }.bind(null, id, imgMime)).catch(function(){}));
      }
      return Promise.all(jobs).then(function(){ return res; });
    });
  }

  function docxDrawing(drawing, res){
    var blip = drawing.getElementsByTagNameNS(NS.a, "blip")[0];
    if (!blip) return "";
    var src = res.images[blip.getAttributeNS(NS.r, "embed")];
    return src ? '<img src="' + src + '" alt="">' : "";
  }

  function docxRuns(node, res){
    var out = "", kids = node.childNodes;
    for (var i = 0; i < kids.length; i++){
      var n = kids[i];
      if (n.nodeType !== 1) continue;

      if (n.localName === "hyperlink"){
        var href = res.links[n.getAttributeNS(NS.r, "id")];
        if (href && !/^(https?:|mailto:)/i.test(href)) href = null;   // javascript: vb. bağlantıları at
        var body = docxRuns(n, res);
        out += href ? '<a href="' + esc(href) + '">' + body + "</a>" : body;
        continue;
      }
      if (n.localName !== "r") continue;

      var inner = "", rk = n.childNodes, rPr = null;
      for (var j = 0; j < rk.length; j++){
        var c = rk[j];
        if (c.nodeType !== 1) continue;
        if (c.localName === "rPr")          rPr = c;
        else if (c.localName === "t")       inner += esc(c.textContent);
        else if (c.localName === "br")      inner += "<br>";
        else if (c.localName === "tab")     inner += "&nbsp;&nbsp;&nbsp;&nbsp;";
        else if (c.localName === "drawing") inner += docxDrawing(c, res);
      }
      if (!inner) continue;

      if (rPr){
        if (rPr.getElementsByTagNameNS(NS.w, "u")[0])      inner = "<u>" + inner + "</u>";
        if (rPr.getElementsByTagNameNS(NS.w, "i")[0])      inner = "<em>" + inner + "</em>";
        if (rPr.getElementsByTagNameNS(NS.w, "strike")[0]) inner = "<s>" + inner + "</s>";
        if (rPr.getElementsByTagNameNS(NS.w, "b")[0])      inner = "<strong>" + inner + "</strong>";
      }
      out += inner;
    }
    return out;
  }

  function docxBlocks(parent, res){
    var html = "", kids = parent.childNodes;
    for (var i = 0; i < kids.length; i++){
      var n = kids[i];
      if (n.nodeType !== 1) continue;

      if (n.localName === "p"){
        var style = "", pPr = null;
        for (var k = 0; k < n.childNodes.length; k++)
          if (n.childNodes[k].nodeType === 1 && n.childNodes[k].localName === "pPr") pPr = n.childNodes[k];
        if (pPr){
          var ps = pPr.getElementsByTagNameNS(NS.w, "pStyle")[0];
          if (ps) style = ps.getAttributeNS(NS.w, "val") || "";
        }
        var inner = docxRuns(n, res);

        // Liste maddesi: işaret ve numara numbering.xml'den üretilir
        var numPr = pPr ? pPr.getElementsByTagNameNS(NS.w, "numPr")[0] : null;
        var marker = "", lvl = 0;
        if (numPr){
          var nEl = numPr.getElementsByTagNameNS(NS.w, "numId")[0];
          var lEl = numPr.getElementsByTagNameNS(NS.w, "ilvl")[0];
          var nId = nEl ? nEl.getAttributeNS(NS.w, "val") : "";
          var il  = lEl ? (lEl.getAttributeNS(NS.w, "val") || "0") : "0";
          lvl = parseInt(il, 10) || 0;
          if (((res.numbering[nId] || {})[il] || "bullet") === "bullet"){
            marker = "• ";
          } else {
            var key = nId + ":" + il;
            res.counters[key] = (res.counters[key] || 0) + 1;
            marker = res.counters[key] + ". ";
            for (var ck in res.counters)                       // alt seviyeler yeniden başlar
              if (ck.indexOf(nId + ":") === 0 && parseInt(ck.split(":")[1], 10) > lvl) res.counters[ck] = 0;
          }
        }

        // Stil kimlikleri Word'ün diline göre değişebiliyor (Heading1 / Balk1 / Başlık1)
        var hm = style.match(/^(?:Heading|Ba[sş]l[ıi]?k|Balk)\s*([1-6])$/i);
        if (hm && !numPr){
          html += "<h" + hm[1] + ">" + (inner || "&nbsp;") + "</h" + hm[1] + ">";
        } else if (numPr || /^(ListParagraph|ListeParagraf)$/i.test(style)){
          html += '<p class="liste"' + (lvl ? ' style="margin-left:' + (26 + lvl * 22) + 'px"' : "")
                + ">" + marker + (inner || "&nbsp;") + "</p>";
        } else {
          html += "<p>" + (inner || "<br>") + "</p>";
        }
        continue;
      }

      if (n.localName === "tbl"){
        html += "<table>";
        for (var r = 0; r < n.childNodes.length; r++){
          var tr = n.childNodes[r];
          if (tr.nodeType !== 1 || tr.localName !== "tr") continue;
          html += "<tr>";
          for (var c2 = 0; c2 < tr.childNodes.length; c2++){
            var tc = tr.childNodes[c2];
            if (tc.nodeType !== 1 || tc.localName !== "tc") continue;
            html += "<td>" + docxBlocks(tc, res) + "</td>";
          }
          html += "</tr>";
        }
        html += "</table>";
      }
    }
    return html;
  }

  function docxToHtml(xmlText, res){
    var doc = new DOMParser().parseFromString(xmlText, "application/xml");
    if (doc.getElementsByTagName("parsererror").length) throw new Error(t("errDocXml"));
    var body = doc.getElementsByTagNameNS(NS.w, "body")[0];
    if (!body) throw new Error(t("errDocBody"));
    var html = docxBlocks(body, res);
    return html || "<p><i>" + esc(t("docEmpty")) + "</i></p>";
  }

  /* ================= ana dönüşüm ================= */

  var OFFICE_MIME = {
    docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation"
  };
  var IMG_EXT = { "image/png":"png", "image/jpeg":"jpg", "image/gif":"gif", "image/webp":"webp",
                  "image/x-icon":"ico", "image/bmp":"bmp", "image/svg+xml":"svg" };

  /* Başarısız dönüşümden sonra kaydet düğmeleri eski içeriğe ait kalmasın */
  function lockOutputs(){
    result = null;
    ["btnSave", "btnWord", "btnPdf", "btnRaw", "btnCopy", "btnOpen"].forEach(function(id){ $(id).disabled = true; });
    $("btnRaw").textContent = t("btnRaw");
  }

  function fail(msg){ lockOutputs(); setStatus(msg, "err"); }

  function convert(){
    if (!input.value.trim()){ fail(t("needInput")); return; }
    setStatus(t("decoding"));
    build().catch(function(e){ fail((e && e.message) ? e.message : String(e)); });
  }

  async function build(){
    var norm, bytes;
    try { norm = normalize(input.value); bytes = toBytes(norm.b64); }
    catch(e){ fail(e.message); return; }

    var mime = norm.mime || sniff(bytes);
    var binary = mime && /^(image|audio|video|application)\//.test(mime)
                 && !/(html|json|xml|javascript|svg)/i.test(mime);
    var text = binary ? null : decodeText(bytes);

    var html, kind, plain = null, word = true, raw = null, original = null, note = "";
    var pdfOk = true;   // yazdırarak PDF'e aktarmak anlamlı mı

    if (text !== null && (looksLikeHtml(text) || /html/i.test(mime || ""))){
      if (/<!doctype\s+html|<html[\s>]/i.test(text)){
        html = text; kind = t("kHtmlDoc");
      } else {
        // Parça HTML: şablona sarılmazsa charset olmadığı için Türkçe karakterler bozulur.
        html = $("optWrap").checked ? wrap(t("wTitleHtml"), text) : text;
        kind = t("kHtmlFrag");
      }
    } else if (isZip(bytes)){
      var zip = null;
      try { zip = readZip(bytes); } catch(e){ note = " " + e.message; }
      var pk = zip ? officeKind(zip) : "bozuk";

      if (pk === "docx"){
        kind = t("kDocx");
        original = bytes;
        raw = { bytes: bytes, ext: "docx", mime: OFFICE_MIME.docx };
        try {
          var res = await readDocxResources(zip);
          await readDocxNumbering(zip, res);
          var xmlText = new TextDecoder().decode(await inflate(zip["word/document.xml"]));
          var inner = docxToHtml(xmlText, res);
          html = $("optWrap").checked ? wrap(t("wTitleDocx"), inner) : inner;
        } catch(e2){
          note = t("okPreviewNo", e2.message);
          html = wrap(kind, t("wDocxFail", fmt(bytes.length), esc(e2.message)));
        }

      } else if (pk === "xlsx" || pk === "pptx"){
        kind = t(pk === "xlsx" ? "kXlsx" : "kPptx");
        raw = { bytes: bytes, ext: pk, mime: OFFICE_MIME[pk] };
        word = false; pdfOk = false;
        html = wrap(kind, t("wOffice", esc(kind), fmt(bytes.length), pk));

      } else if (zip){
        var names = Object.keys(zip);
        kind = t("kZip");
        raw = { bytes: bytes, ext: "zip", mime: "application/zip" };
        word = false; pdfOk = false;
        html = wrap(kind, t("wZipBody", names.length, fmt(bytes.length)) + "<ul>"
             + names.slice(0, 200).map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"
             + (names.length > 200 ? t("wZipMore", names.length - 200) : ""));

      } else {
        kind = t("kZipBad");
        raw = { bytes: bytes, ext: "zip", mime: "application/zip" };
        word = false; pdfOk = false;
        html = wrap(kind, t("wZipBad", fmt(bytes.length)));
      }

    } else if (mime && /^image\//.test(mime)){
      var img = '<img src="data:' + mime + ";base64," + norm.b64 + '" alt="base64">';
      html = $("optWrap").checked ? wrap(t("wTitleImage"), img) : img;
      kind = t("kImage", mime);
      word = /^image\/(png|jpeg|gif)$/.test(mime);
      raw = { bytes: bytes, ext: IMG_EXT[mime] || "img", mime: mime };
    } else if (mime === "application/pdf"){
      var pdf = '<embed src="data:application/pdf;base64,' + norm.b64 + '" type="application/pdf">';
      html = $("optWrap").checked ? wrap(t("kPdf"), pdf) : pdf;
      kind = t("kPdf");
      word = false; pdfOk = false;   // zaten PDF; "Kaynak dosya (.pdf)" ile kaydedilir
      raw = { bytes: bytes, ext: "pdf", mime: "application/pdf" };
    } else if (text !== null){
      html = $("optWrap").checked ? wrap(t("wTitleText"), "<pre>" + esc(text) + "</pre>") : "<pre>" + esc(text) + "</pre>";
      kind = t("kText");
      plain = text;
    } else {
      kind = mime ? t("kBinaryMime", mime) : t("kBinary");
      word = false; pdfOk = false;
      raw = { bytes: bytes, ext: "bin", mime: mime || "application/octet-stream" };
      html = wrap(t("wTitleBin"), t("wBinBody", mime ? " (" + esc(mime) + ")" : "", fmt(bytes.length)));
    }

    result = { html: html, kind: kind, size: bytes.length, text: plain,
               word: word, raw: raw, original: original, pdfOk: pdfOk };
    // Çözülen içerikteki betikler uygulamanın adresinde çalışmasın. Tek istisna, PDF görüntüleyici
    // eklentisine ihtiyaç duyan ve tamamen bizim ürettiğimiz PDF sarmalayıcısı.
    if (kind === "PDF") preview.removeAttribute("sandbox");
    else preview.setAttribute("sandbox", "allow-popups allow-popups-to-escape-sandbox");
    preview.srcdoc = html;
    codeEl.textContent = html;
    ["btnSave", "btnCopy", "btnOpen"].forEach(function(id){ $(id).disabled = false; });
    $("btnWord").disabled = !word;
    $("btnPdf").disabled  = !pdfOk;
    $("btnRaw").disabled  = !raw;
    $("btnRaw").textContent = raw ? t("btnRawExt", raw.ext) : t("btnRaw");

    setStatus(t("okDecoded", kind, fmt(bytes.length)) + (word ? "" : t("okNoWord")) + note,
      note ? "err" : "ok");
  }

  /* ================= ters yön: dosya / metin → base64 ================= */

  var mode = "decode";
  var encSource = null;   // { bytes, mime, name, label, b64 }

  function setMode(m){
    mode = m;
    var dec = (m === "decode");
    $("modeDecode").setAttribute("aria-selected", String(dec));
    $("modeEncode").setAttribute("aria-selected", String(!dec));

    ["input", "decOpts", "decBarIn", "decTabs", "decBar"].forEach(function(id){
      $(id).classList.toggle("hidden", !dec);
    });
    ["encDrop", "encText", "encOpts", "encBarIn", "encBar"].forEach(function(id){
      $(id).classList.toggle("hidden", dec);
    });

    if (dec){
      $("b64out").classList.add("hidden");
      tab($("tabPreview").getAttribute("aria-selected") === "true");
    } else {
      $("preview").classList.add("hidden");
      $("code").classList.add("hidden");
      $("b64out").classList.remove("hidden");
    }

    $("outTitle").textContent = t(dec ? "outTitle" : "outTitleEnc");
    setStatus(t(dec ? "ready" : "encReady"));
  }

  function renderEncoded(){
    if (!encSource) return;
    if (!encSource.b64) encSource.b64 = b64encode(encSource.bytes);

    var body = $("optLineWrap").checked ? encSource.b64.replace(/(.{76})/g, "$1\n") : encSource.b64;
    var text = $("optDataUri").checked
      ? "data:" + encSource.mime + ";base64," + body
      : body;

    $("b64out").value = text;
    $("btnB64Copy").disabled = false;
    $("btnB64Save").disabled = false;
    setStatus(t("okEncoded", encSource.label, fmt(encSource.b64.length), fmt(encSource.bytes.length)), "ok");
  }

  function encodeFile(f){
    setStatus(t("encoding"));
    var r = new FileReader();
    r.onload = function(){
      var bytes = new Uint8Array(r.result);
      encSource = {
        bytes: bytes,
        mime: f.type || sniff(bytes) || "application/octet-stream",
        name: f.name + ".b64.txt",
        label: f.name
      };
      renderEncoded();
    };
    r.onerror = function(){ setStatus(t("errFileRead"), "err"); };
    r.readAsArrayBuffer(f);
  }

  function encodeText(str){
    encSource = {
      bytes: new TextEncoder().encode(str),
      mime: "text/plain;charset=utf-8",
      name: t("encName"),
      label: t("encLabelText")
    };
    renderEncoded();
  }

  function clearEncode(){
    encSource = null;
    $("encText").value = "";
    $("b64out").value = "";
    $("btnB64Copy").disabled = true;
    $("btnB64Save").disabled = true;
    setStatus(t("cleared"));
  }

  /* ================= arayüz ================= */

  function download(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function tab(showPreview){
    $("tabPreview").setAttribute("aria-selected", String(showPreview));
    $("tabCode").setAttribute("aria-selected", String(!showPreview));
    preview.classList.toggle("hidden", !showPreview);
    codeEl.classList.toggle("hidden", showPreview);
  }
  $("tabPreview").onclick = function(){ tab(true); };
  $("tabCode").onclick    = function(){ tab(false); };

  $("btnConvert").onclick = convert;

  $("btnClear").onclick = function(){
    input.value = ""; result = null; preview.srcdoc = ""; codeEl.textContent = "";
    ["btnSave", "btnWord", "btnPdf", "btnRaw", "btnCopy", "btnOpen"].forEach(function(id){ $(id).disabled = true; });
    $("btnRaw").textContent = t("btnRaw");
    setStatus(t("cleared"));
    input.focus();
  };

  $("btnSample").onclick = function(){
    var tr = (lang !== "en");
    var demo = '<!doctype html><html lang="' + lang + '"><head><meta charset="utf-8"><title>'
      + (tr ? "Ornek" : "Sample") + "</title></head>"
      + '<body style="font-family:system-ui;padding:32px">'
      + "<h1>" + (tr ? "Merhaba!" : "Hello!") + "</h1>"
      + "<p>" + (tr ? "Bu sayfa <b>base64</b> icinden cozuldu."
                    : "This page was decoded from <b>base64</b>.") + "</p>"
      + "<h2>" + (tr ? "Neler yapabilir" : "What it can do") + "</h2>"
      + "<ul><li>" + (tr ? "Onizleme calisiyor" : "The preview works") + "</li>"
      + "<li>" + (tr ? "<i>.html</i> olarak kaydedebilirsin" : "Save it as <i>.html</i>") + "</li>"
      + "<li>" + (tr ? "Word <b>.docx</b> olarak da kaydedebilirsin" : "Save it as Word <b>.docx</b>") + "</li>"
      + "<li>" + (tr ? "PDF olarak da kaydedebilirsin" : "Save it as PDF too") + "</li></ul>"
      + "<table><tr><th>" + (tr ? "Bicim" : "Format") + "</th><th>" + (tr ? "Durum" : "Status") + "</th></tr>"
      + "<tr><td>HTML</td><td>" + (tr ? "hazir" : "ready") + "</td></tr>"
      + "<tr><td>Word</td><td>" + (tr ? "hazir" : "ready") + "</td></tr>"
      + "<tr><td>PDF</td><td>" + (tr ? "hazir" : "ready") + "</td></tr></table>"
      + "</body></html>";
    input.value = btoa(unescape(encodeURIComponent(demo)));
    convert();
  };

  $("btnPaste").onclick = function(){
    if (!navigator.clipboard || !navigator.clipboard.readText){
      setStatus(t("errClipRead"), "err"); return;
    }
    navigator.clipboard.readText()
      .then(function(txt){ input.value = txt; convert(); })
      .catch(function(){ setStatus(t("errClipPerm"), "err"); });
  };

  function readFile(f){
    var r = new FileReader();
    r.onload  = function(){ input.value = String(r.result); convert(); };
    r.onerror = function(){ setStatus(t("errFileRead"), "err"); };
    r.readAsText(f);
  }

  $("fileIn").onchange = function(e){
    var f = e.target.files[0];
    if (f) readFile(f);
    e.target.value = "";
  };

  var panel = $("inPanel");
  ["dragenter", "dragover"].forEach(function(ev){
    panel.addEventListener(ev, function(e){ e.preventDefault(); panel.classList.add("drop"); });
  });
  ["dragleave", "drop"].forEach(function(ev){
    panel.addEventListener(ev, function(e){ e.preventDefault(); panel.classList.remove("drop"); });
  });
  panel.addEventListener("drop", function(e){
    var f = e.dataTransfer.files[0];
    if (!f) return;
    // Çözme modunda dosya base64 METNİ olarak okunur; kodlama modunda ham bayt olarak.
    if (mode === "decode") readFile(f); else encodeFile(f);
  });

  $("modeDecode").onclick = function(){ setMode("decode"); };
  $("modeEncode").onclick = function(){ setMode("encode"); };

  $("encFileIn").onchange = function(e){
    var f = e.target.files[0];
    if (f) encodeFile(f);
    e.target.value = "";
  };

  $("btnEncode").onclick = function(){
    var txt = $("encText").value;
    if (txt) { encodeText(txt); return; }
    if (encSource) { renderEncoded(); return; }
    setStatus(t("needSource"), "err");
  };

  $("btnEncClear").onclick = clearEncode;

  ["optDataUri", "optLineWrap"].forEach(function(id){
    $(id).onchange = function(){ if (encSource) renderEncoded(); };
  });

  $("encText").addEventListener("keydown", function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){
      e.preventDefault();
      if ($("encText").value) encodeText($("encText").value);
    }
  });

  $("btnB64Copy").onclick = function(){
    navigator.clipboard.writeText($("b64out").value)
      .then(function(){ setStatus(t("okCopiedB64"), "ok"); })
      .catch(function(){ setStatus(t("errCopyB64"), "err"); });
  };

  $("btnB64Save").onclick = function(){
    var name = encSource ? encSource.name : "base64.txt";
    download(new Blob([$("b64out").value], { type: "text/plain;charset=utf-8" }), name);
    setStatus(t("okSavedTxt", name), "ok");
  };

  $("btnSave").onclick = function(){
    download(new Blob([result.html], { type: "text/html;charset=utf-8" }), "cikti.html");
    setStatus(t("okSavedHtml"), "ok");
  };

  $("btnWord").onclick = function(){
    try {
      // Girdi zaten bir .docx ise yeniden üretmeyiz; kaynağı birebir kaydederiz.
      var blob = result.original
        ? new Blob([result.original], { type: OFFICE_MIME.docx })
        : htmlToDocx(result.html, result.text);
      download(blob, "cikti.docx");
      setStatus(t("okSavedDocx", Math.round(blob.size / 1024))
        + (result.original ? t("okDocxOrig") : "."), "ok");
    } catch(e){
      setStatus(t("errWord", e.message), "err");
    }
  };

  $("btnRaw").onclick = function(){
    var name = "cikti." + result.raw.ext;
    download(new Blob([result.raw.bytes], { type: result.raw.mime }), name);
    setStatus(t("okSavedRaw", name, fmt(result.raw.bytes.length)), "ok");
  };

  $("btnCopy").onclick = function(){
    navigator.clipboard.writeText(result.html)
      .then(function(){ setStatus(t("okCopied"), "ok"); })
      .catch(function(){ setStatus(t("errCopy"), "err"); });
  };

  /* Yeni sekme aynı adreste açılır; CSP ile betikleri kapatırız. Meta en başa konur
     (doctype varsa hemen arkasına) — ayrıştırıcı onu head'e taşır, içerik bunu atlatamaz. */
  function withoutScripts(html){
    var meta = '<meta http-equiv="Content-Security-Policy" content="script-src ' + "'none'" + '">';
    var dt = html.match(/^\s*<!doctype[^>]*>/i);
    return dt ? dt[0] + meta + html.slice(dt[0].length) : meta + html;
  }

  $("btnOpen").onclick = function(){
    var w = window.open("", "_blank");
    if (!w){ setStatus(t("errPopup"), "err"); return; }
    w.document.open(); w.document.write(withoutScripts(result.html)); w.document.close();
  };

  /* PDF üretmek için tarayıcının yazdırma penceresini kullanırız: kullanıcı hedef olarak
     "PDF olarak kaydet" seçer. Türkçe karakterler, tablolar ve görseller olduğu gibi çıkar. */
  $("btnPdf").onclick = function(){
    var w = window.open("", "_blank");
    if (!w){ setStatus(t("errPopupPdf"), "err"); return; }
    w.document.open(); w.document.write(withoutScripts(result.html)); w.document.close();

    var done = false;
    function print(){
      if (done) return;
      done = true;
      try { w.focus(); w.print(); }
      catch(e){ setStatus(t("errPrint", e.message), "err"); }
    }
    // Görseller yüklendikten sonra yazdır; load olayı gelmezse yine de dene.
    if (w.document.readyState === "complete") setTimeout(print, 200);
    else w.addEventListener("load", function(){ setTimeout(print, 200); });
    setTimeout(print, 3000);

    setStatus(t("okPrint"), "ok");
  };

  input.addEventListener("keydown", function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); convert(); }
  });

  $("langTr").onclick = function(){ setLang("tr"); };
  $("langEn").onclick = function(){ setLang("en"); };

  /* Kayıtlı tercih varsa onu, yoksa tarayıcı dilini kullan */
  var saved = null;
  try { saved = localStorage.getItem("b64lang"); } catch(e){}
  lang = saved || (/^tr\b/i.test(navigator.language || "") ? "tr" : "en");
  applyLang();

  input.focus();
})();
</script>
</body>
</html>
